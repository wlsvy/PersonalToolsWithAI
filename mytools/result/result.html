<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>요약</title>
  <!-- 본문 링크를 누르면 결과 탭을 떠나지 않게 새 탭으로 -->
  <base target="_blank">
  <link rel="stylesheet" href="../shared/theme.css">
  <style>
    * { box-sizing: border-box; }
    body {
      max-width: 760px; margin: 0 auto; padding: 24px 16px 64px;
      font: 15px/1.7 system-ui, -apple-system, sans-serif;
      color: var(--text); background: var(--bg);
    }
    h1 { font-size: 20px; line-height: 1.4; margin: 0 0 4px; }
    #url { color: var(--muted); font-size: 12px; word-break: break-all; }
    #words { color: var(--muted); font-size: 12px; margin: 4px 0 16px; }
    #status {
      padding: 8px 12px; border-radius: 8px; font-size: 13px;
      background: var(--accent-soft); color: var(--accent);
    }
    #status:empty { display: none; }
    #status.busy::before {
      content: ''; display: inline-block; width: 12px; height: 12px; margin-right: 8px; vertical-align: -2px;
      border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #status.busy::before { animation-duration: 3s; } }
    section {
      margin-top: 16px; padding: 16px 20px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--border);
    }
    section:has(.md:empty) { display: none; }
    section:has(.md:empty) + .actions:has(#copy-translation) { display: none; }
    section > h2 { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
    pre { white-space: pre-wrap; word-break: break-word; font: inherit; margin: 0; }

    /* 렌더링된 Markdown */
    .md { overflow-wrap: break-word; }
    .md > :first-child { margin-top: 0; }
    .md > :last-child { margin-bottom: 0; }
    .md h1, .md h2, .md h3, .md h4 { line-height: 1.4; margin: 1.4em 0 .5em; }
    .md h1 { font-size: 20px; }
    .md h2 { font-size: 18px; }
    .md h3 { font-size: 16px; }
    .md p, .md ul, .md ol, .md blockquote, .md table { margin: .6em 0; }
    .md ul, .md ol { padding-left: 1.4em; }
    .md a { color: var(--accent); }
    .md img { max-width: 100%; height: auto; }
    .md blockquote { padding-left: 12px; border-left: 3px solid var(--border); color: var(--muted); }
    .md code { font: 13px/1.5 ui-monospace, Menlo, monospace; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
    .md pre { white-space: pre; overflow-x: auto; padding: 12px; border-radius: 8px; background: var(--bg); }
    .md pre code { padding: 0; background: none; }
    .md table { display: block; overflow-x: auto; border-collapse: collapse; }
    .md th, .md td { border: 1px solid var(--border); padding: 4px 8px; }
    .md .mermaid { overflow-x: auto; text-align: center; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    button {
      padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #copy, #copy-translation { background: var(--accent); border-color: var(--accent); color: #fff; }
    #toast {
      position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 8px);
      padding: 8px 16px; border-radius: 8px; font-size: 13px;
      background: var(--text); color: var(--bg); box-shadow: 0 4px 12px rgb(0 0 0 / .2);
      opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
    details { margin-top: 16px; color: var(--muted); }
    details pre { margin-top: 8px; font-size: 13px; color: var(--text); }
  </style>
  <script type="module" src="result.js"></script>
</head>
<body>
  <h1 id="title"></h1>
  <a id="url" target="_blank" rel="noopener"></a>
  <div id="words"></div>
  <p id="status" role="status"></p>

  <section><h2>요약</h2><div id="summary" class="md"></div></section>
  <div class="actions">
    <button id="copy" type="button" disabled>요약 Markdown 복사</button>
    <button id="translate" type="button" disabled>마저 번역</button>
  </div>
  <section><h2>번역</h2><div id="translation" class="md"></div></section>
  <div class="actions">
    <button id="copy-translation" type="button" disabled>번역 Markdown 복사</button>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <details><summary>원문 Markdown</summary><pre id="source"></pre></details>
</body>
</html>
